<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f78"><title>Medica Pharmacy v9 · Login</title><link rel="stylesheet" href="styles.css"><style>.login-shell{max-width:560px;margin:8vh auto;padding:24px}.login-card{background:white;border:1px solid #dce8e5;border-radius:20px;padding:26px;box-shadow:0 12px 34px #123c3214}.login-card h1{margin-top:0}.login-card label{display:grid;gap:5px;margin:14px 0}.login-card input,.login-card select{padding:10px;border:1px solid #dce8e5;border-radius:10px}.login-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.login-card a{color:#087f78}.login-msg{min-height:1.5em}.langpick{float:inline-end}</style></head><body><main class="login-shell"><section class="login-card"><a href="./index.html" id="back">← <span id="backtext">Back to pharmacy</span></a><select class="langpick" id="language" aria-label="Language"><option value="fa">فارسی</option><option value="en">English</option><option value="ar">العربية</option><option value="de">Deutsch</option></select><h1 id="title">ورود به مدیکا</h1><p id="demo">ورود آزمایشی فقط روی همین دستگاه ذخیره می‌شود؛ سامانه احراز هویت امن نیست. گذرواژه واقعی وارد نکنید.</p><form id="form"><label><span id="rolelabel">نوع حساب</span><select id="role"><option value="pharmacist" data-role="pharmacist">داروساز</option><option value="patient" data-role="patient">بیمار</option><option value="traveler" data-role="traveler">مسافر</option><option value="admin" data-role="admin">مدیر</option></select></label><label><span id="userlabel">نام کاربری</span><input id="user" autocomplete="username" required></label><label><span id="passlabel">گذرواژهٔ نمایشی</span><input id="pass" type="password" autocomplete="current-password" required></label><div class="login-actions"><button class="primary" id="login" type="submit">ورود آزمایشی</button><button class="secondary" id="logout" type="button">خروج</button><span id="session"></span></div><p class="login-msg" id="msg" aria-live="polite"></p></form></section></main><script>const T={fa:{title:'ورود به مدیکا',back:'بازگشت به داروخانه',demo:'ورود آزمایشی فقط روی همین دستگاه ذخیره می‌شود؛ احراز هویت امن نیست. گذرواژه واقعی وارد نکنید.',role:'نوع حساب',user:'نام کاربری',pass:'گذرواژهٔ نمایشی',login:'ورود آزمایشی',logout:'خروج',roles:['داروساز','بیمار','مسافر','مدیر'],bad:'نام کاربری و گذرواژه را وارد کنید.',ok:'نشست آزمایشی فعال',out:'نشستی فعال نیست'},en:{title:'Sign in to Medica',back:'Back to pharmacy',demo:'Demo sign-in is stored on this device only; authentication is not secure. Do not enter a real password.',role:'Account type',user:'Username',pass:'Demo password',login:'Demo sign in',logout:'Sign out',roles:['Pharmacist','Patient','Traveler','Admin'],bad:'Enter a username and password.',ok:'Demo session active',out:'No active session'},de:{title:'Bei Medica anmelden',back:'Zurück zur Apotheke',demo:'Die Demo-Anmeldung wird nur auf diesem Gerät gespeichert; sie ist nicht sicher. Kein echtes Passwort eingeben.',role:'Kontotyp',user:'Benutzername',pass:'Demo-Passwort',login:'Demo-Anmeldung',logout:'Abmelden',roles:['Apotheker','Patient','Reisende','Verwaltung'],bad:'Benutzername und Passwort eingeben.',ok:'Demo-Sitzung aktiv',out:'Keine aktive Sitzung'},ar:{title:'تسجيل الدخول إلى ميديكا',back:'العودة إلى الصيدلية',demo:'يُحفظ الدخول التجريبي على هذا الجهاز فقط؛ المصادقة غير آمنة. لا تدخل كلمة مرور حقيقية.',role:'نوع الحساب',user:'اسم المستخدم',pass:'كلمة مرور تجريبية',login:'دخول تجريبي',logout:'خروج',roles:['صيدلي','مريض','مسافر','إدارة'],bad:'أدخل اسم المستخدم وكلمة المرور.',ok:'الجلسة التجريبية نشطة',out:'لا توجد جلسة نشطة'}};const sel=document.querySelector('#language');sel.value=localStorage.getItem('medica-language')||'fa';function paint(){let l=sel.value,t=T[l];document.documentElement.lang=l;document.documentElement.dir=['fa','ar'].includes(l)?'rtl':'ltr';for(let [id,key] of [['title','title'],['backtext','back'],['demo','demo'],['rolelabel','role'],['userlabel','user'],['passlabel','pass'],['login','login'],['logout','logout']])document.getElementById(id).textContent=t[key];document.querySelectorAll('[data-role]').forEach((o,i)=>o.textContent=t.roles[i]);document.querySelector('#session').textContent=localStorage.getItem('medica-session')?t.ok:t.out}sel.onchange=()=>{localStorage.setItem('medica-language',sel.value);paint()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();let u=document.querySelector('#user').value.trim(),p=document.querySelector('#pass').value;if(!u||!p){document.querySelector('#msg').textContent=T[sel.value].bad;return}localStorage.setItem('medica-session',JSON.stringify({user:u,role:document.querySelector('#role').value,at:Date.now()}));document.querySelector('#msg').textContent=T[sel.value].ok;paint()};document.querySelector('#logout').onclick=()=>{localStorage.removeItem('medica-session');document.querySelector('#msg').textContent=T[sel.value].out;paint()};paint();</script></body></html>
